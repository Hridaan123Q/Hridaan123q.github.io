name: Release macOS App

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build macOS App
        run: |
          xcodebuild -project "PromptArchitect.xcodeproj" -scheme "PromptArchitect" -configuration Release -derivedDataPath build -destination 'platform=macOS' build CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Package App
        run: |
          mkdir -p release_package
          cp -R build/Build/Products/Release/PromptArchitect.app release_package/
          cd release_package
          zip -r ../PromptArchitect-macOS.zip PromptArchitect.app

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: PromptArchitect-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
